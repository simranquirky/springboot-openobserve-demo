dependencies {
    // Core Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // Spring Boot Actuator for metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // OpenTelemetry integration via Spring Boot
    implementation 'io.micrometer:micrometer-tracing-bridge-otel:1.2.0'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp:1.31.0'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:2.15.0'
	runtimeOnly("io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.15.0-alpha")
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}


tasks.named('test') {
	useJUnitPlatform()
}


bootRun {
    jvmArgs = [
        "-javaagent:/opt/otel/opentelemetry-javaagent-2.15.0.jar", // Use your java-agent Jar file path
        "-Dotel.exporter=otlp",
        "-Dotel.otlp.endpoint=http://localhost:4317",  // Use your OTLP endpoint
        "-Dotel.service.name=demo",
        "-Dotel.metrics.exporter=otlp"
    ]
}
